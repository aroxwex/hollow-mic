name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the exe to a release when a v* tag is pushed

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build HollowMic.exe
        run: make CXX=x86_64-w64-mingw32-g++ WINDRES=x86_64-w64-mingw32-windres

      - name: Checksum
        run: sha256sum HollowMic.exe | tee HollowMic.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: HollowMic
          path: |
            HollowMic.exe
            HollowMic.exe.sha256

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HollowMic.exe
            HollowMic.exe.sha256
          generate_release_notes: true
